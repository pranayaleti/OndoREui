name: Deploy static site to GitHub Pages

on:
  # Deploy only after "OndoREui CI" passes on main. This previously ran on every
  # push to main with no dependency on CI, so a commit failing a11y or unit tests
  # still shipped the licensed public site.
  workflow_run:
    workflows: ["OndoREui CI"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # workflow_run fires on completion whatever the outcome, so gate on success.
    # workflow_dispatch stays open as a deliberate manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch; pin to the exact commit CI
          # validated so we never ship something CI did not actually test.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CI/deploy use Node 24 (GitHub Actions). .nvmrc 20.19.0 is the local floor matching engines >=20.19.0.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run build

      - name: Add CNAME, disable Jekyll, write build id
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cp CNAME out/CNAME
          touch out/.nojekyll
          python3 - <<'PY'
          import json, os, pathlib
          sha = os.environ["BUILD_SHA"]
          payload = json.dumps({"sha": sha}) + "\n"
          pathlib.Path("out/ondo-build.json").write_text(payload, encoding="utf-8")
          build_dir = pathlib.Path("out/ondo-build")
          build_dir.mkdir(parents=True, exist_ok=True)
          (build_dir / "index.json").write_text(payload, encoding="utf-8")
          print(f"Wrote out/ondo-build.json and out/ondo-build/index.json sha={sha}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Required repository secrets (do not commit values; never echo the token):
  #   CF_API_TOKEN  — Zone Cache Purge + Zone Read (alias: CLOUDFLARE_API_TOKEN)
  #   CF_ZONE_ID    — ondorealestate.com zone     (alias: CLOUDFLARE_ZONE_ID)
  # Missing secrets: warn and continue. Present but failed API call: fail.
  # Same zone also hosts api.ondorealestate.com and app.ondorealestate.com
  # (Worker ondo-api-gateway on api.*). Purge by hostname for www + apex only —
  # never purge_everything.
  purge-cloudflare:
    needs: build-and-deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      purged: ${{ steps.purge.outputs.purged }}
    steps:
      - name: Purge Cloudflare cache (www + apex hosts)
        id: purge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set +x
          TOKEN="${CF_API_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}"
          ZONE="${CF_ZONE_ID:-${CLOUDFLARE_ZONE_ID:-}}"
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "purged=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare cache purge skipped: set repository secrets CF_API_TOKEN and CF_ZONE_ID (aliases CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID). Forks without secrets still succeed."
            exit 0
          fi
          export TOKEN ZONE
          HTTP=$(curl -sS -o /tmp/cf-zone.json -w "%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json")
          export CF_ZONE_HTTP="$HTTP"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ["TOKEN"]
          zone = os.environ["ZONE"]
          expected = "ondorealestate.com"
          http = os.environ.get("CF_ZONE_HTTP", "")
          github_output = os.environ["GITHUB_OUTPUT"]

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          def purge(payload: dict, label: str) -> None:
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      purge_http = resp.status
                      data = json.loads(resp.read())
              except urllib.error.HTTPError as exc:
                  purge_http = exc.code
                  raw = exc.read().decode()
                  try:
                      data = json.loads(raw)
                  except json.JSONDecodeError:
                      fail(f"Cloudflare cache purge HTTP {purge_http}: {raw[:240]}")
              except urllib.error.URLError as exc:
                  fail(f"Cloudflare cache purge network error: {exc}")
              print(label, json.dumps({k: data.get(k) for k in ("success", "errors", "messages")}, indent=2))
              if purge_http != 200 or not data.get("success"):
                  fail(f"Cloudflare cache purge failed ({label}). Token needs Zone Cache Purge. Never purge_everything.")

          try:
              with open("/tmp/cf-zone.json", encoding="utf-8") as f:
                  zone_body = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cloudflare zone lookup: could not parse API response ({exc}).")

          if http == "403":
              print("::warning::Token cannot GET the zone; skipping name check and continuing with hostname purge.")
          elif http != "200" or not zone_body.get("success"):
              fail("Cloudflare zone lookup failed. Token needs Zone Read on the ondorealestate.com zone.")
          else:
              name = (zone_body.get("result") or {}).get("name")
              if name != expected:
                  fail(f"Refusing purge: zone is {name!r}, expected {expected!r}.")
              print(f"Zone ok: {name}")

          # Cloudflare allows only one of hosts/files/tags/prefixes per request.
          purge({"hosts": ["www.ondorealestate.com", "ondorealestate.com"]}, "hosts")
          purge({"files": [
              "https://www.ondorealestate.com/",
              "https://www.ondorealestate.com/index.html",
              "https://www.ondorealestate.com/ondo-build.json",
              "https://www.ondorealestate.com/ondo-build/index.json",
              "https://ondorealestate.com/",
          ]}, "files")
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write("purged=yes\n")
          print("Cloudflare cache purged for www + apex (hosts and HTML/JSON URLs).")
          PY

  # A deploy that reports success but never reaches the edge is now a red build.
  # Cache-busted 200s alone can pass on stale Cloudflare HTML. ondo-build.json is
  # written with this workflow's commit SHA so smoke proves THIS build is live.
  # GitHub Pages Fastly uses max-age=600; 40×15s covers that TTL when CF secrets
  # are missing and hostname purge is skipped.
  verify-production:
    needs: purge-cloudflare
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production URLs return 200 and this build SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PURGED: ${{ needs.purge-cloudflare.outputs.purged }}
        run: |
          set -euo pipefail
          URLS="https://www.ondorealestate.com/ https://www.ondorealestate.com/blog/two-years-of-tax-returns-vs-one-year-mortgage/ https://www.ondorealestate.com/calculators/cost-of-living/"
          BUILD_URLS="https://www.ondorealestate.com/ondo-build.json https://www.ondorealestate.com/ondo-build/index.json"
          PAGES_IP="185.199.108.153"
          ATTEMPTS=40

          if [ -z "${EXPECTED_SHA}" ]; then
            echo "::error::No expected commit SHA; cannot verify this deploy."
            exit 1
          fi
          echo "Expecting production build sha=${EXPECTED_SHA} (cloudflare_purge=${PURGED:-unknown})"

          extract_sha() {
            python3 - "$1" "$2" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          ctype = sys.argv[2].lower()
          stripped = raw.lstrip()
          if "json" not in ctype and not stripped.startswith("{"):
              raise SystemExit(0)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit(0)
          sha = data.get("sha") if isinstance(data, dict) else None
          if isinstance(sha, str) and sha:
              print(sha)
          PY
          }

          header_ctype() {
            python3 - "$1" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().split("\r\n\r\n", 1)[0]
          ctype = ""
          for line in text.splitlines():
              if line.lower().startswith("content-type:"):
                  ctype = line.split(":", 1)[1].strip()
          print(ctype)
          PY
          }

          ORIGIN_MATCH=0
          for attempt in $(seq 1 "$ATTEMPTS"); do
            ALL_OK=1
            for url in $URLS; do
              CB=$(date +%s%N)
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${url}?cb=${CB}" || true)
              echo "attempt ${attempt}/${ATTEMPTS}: ${url} -> ${STATUS}"
              if [ "$STATUS" != "200" ]; then
                ALL_OK=0
              fi
            done

            LIVE_SHA=""
            MATCH_URL=""
            for burl in $BUILD_URLS; do
              CB=$(date +%s%N)
              BUILD_STATUS=$(curl -sS -D /tmp/ondo-build.hdr -o /tmp/ondo-build.body -w '%{http_code}' --max-time 30 "${burl}?cb=${CB}" || true)
              CTYPE=$(header_ctype /tmp/ondo-build.hdr)
              CANDIDATE=""
              if [ "$BUILD_STATUS" = "200" ]; then
                CANDIDATE=$(extract_sha /tmp/ondo-build.body "$CTYPE" || true)
              fi
              echo "attempt ${attempt}/${ATTEMPTS}: ${burl} -> ${BUILD_STATUS} type=${CTYPE:-none} sha=${CANDIDATE:-none}"
              if [ "$CANDIDATE" = "$EXPECTED_SHA" ]; then
                LIVE_SHA="$CANDIDATE"
                MATCH_URL="$burl"
                break
              fi
            done
            if [ -z "$LIVE_SHA" ]; then
              ALL_OK=0
            fi

            ORIGIN_SHA=""
            ORIGIN_STATUS=$(curl -sk --resolve "www.ondorealestate.com:443:${PAGES_IP}" -D /tmp/ondo-origin.hdr -o /tmp/ondo-origin.body -w '%{http_code}' --max-time 20 "https://www.ondorealestate.com/ondo-build.json" || true)
            ORIGIN_CTYPE=$(header_ctype /tmp/ondo-origin.hdr)
            if [ "$ORIGIN_STATUS" = "200" ]; then
              ORIGIN_SHA=$(extract_sha /tmp/ondo-origin.body "$ORIGIN_CTYPE" || true)
            fi
            echo "attempt ${attempt}/${ATTEMPTS}: pages-origin -> ${ORIGIN_STATUS} sha=${ORIGIN_SHA:-none}"
            if [ "${ORIGIN_SHA:-}" = "$EXPECTED_SHA" ]; then
              ORIGIN_MATCH=1
              if [ "$ALL_OK" != "1" ]; then
                echo "::warning::GitHub Pages origin has this SHA but www.ondorealestate.com does not. Cloudflare is serving stale HTML."
              fi
            fi

            if [ "$ALL_OK" = "1" ]; then
              echo "Production URLs returned 200 and ${MATCH_URL} matches ${EXPECTED_SHA}."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Production never returned 200 for all smoke URLs with build sha=${EXPECTED_SHA} after deploy+purge."
          if [ "$ORIGIN_MATCH" = "1" ]; then
            echo "::error::GitHub Pages origin already has this SHA; Cloudflare is not serving Pages. Set CF_API_TOKEN and CF_ZONE_ID on OndoREui."
          elif [ "${PURGED:-}" = "skipped" ]; then
            echo "::error::Cloudflare cache purge was skipped. Set CF_API_TOKEN and CF_ZONE_ID on OndoREui so www.ondorealestate.com is not left serving a cached 404/HTML document."
          fi
          exit 1
