name: Deploy static site to GitHub Pages

on:
  # Deploy only after "OndoREui CI" passes on main. This previously ran on every
  # push to main with no dependency on CI, so a commit failing a11y or unit tests
  # still shipped the licensed public site.
  workflow_run:
    workflows: ["OndoREui CI"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # workflow_run fires on completion whatever the outcome, so gate on success.
    # workflow_dispatch stays open as a deliberate manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch; pin to the exact commit CI
          # validated so we never ship something CI did not actually test.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CI/deploy use Node 24 (GitHub Actions). .nvmrc 20.19.0 is the local floor matching engines >=20.19.0.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run build

      - name: Add CNAME and disable Jekyll processing
        run: |
          cp CNAME out/CNAME
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Required repository secrets (do not commit values; never echo the token):
  #   CF_API_TOKEN  — Zone Cache Purge + Zone Read (alias: CLOUDFLARE_API_TOKEN)
  #   CF_ZONE_ID    — ondorealestate.com zone     (alias: CLOUDFLARE_ZONE_ID)
  # Missing secrets: warn and continue. Present but failed API call: fail.
  # Same zone also hosts api.ondorealestate.com and app.ondorealestate.com
  # (Worker ondo-api-gateway on api.*). Purge by hostname for www + apex only —
  # never purge_everything.
  purge-cloudflare:
    needs: build-and-deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Purge Cloudflare cache (www + apex hosts)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set +x
          TOKEN="${CF_API_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}"
          ZONE="${CF_ZONE_ID:-${CLOUDFLARE_ZONE_ID:-}}"
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "::warning::Cloudflare cache purge skipped: set repository secrets CF_API_TOKEN and CF_ZONE_ID (aliases CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID). Forks without secrets still succeed."
            exit 0
          fi
          export TOKEN ZONE
          HTTP=$(curl -sS -o /tmp/cf-zone.json -w "%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json")
          export CF_ZONE_HTTP="$HTTP"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ["TOKEN"]
          zone = os.environ["ZONE"]
          expected = "ondorealestate.com"
          http = os.environ.get("CF_ZONE_HTTP", "")

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          try:
              with open("/tmp/cf-zone.json", encoding="utf-8") as f:
                  zone_body = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cloudflare zone lookup: could not parse API response ({exc}).")

          if http == "403":
              print("::warning::Token cannot GET the zone; skipping name check and continuing with hostname purge.")
          elif http != "200" or not zone_body.get("success"):
              fail("Cloudflare zone lookup failed. Token needs Zone Read on the ondorealestate.com zone.")
          else:
              name = (zone_body.get("result") or {}).get("name")
              if name != expected:
                  fail(f"Refusing purge: zone is {name!r}, expected {expected!r}.")
              print(f"Zone ok: {name}")

          payload = json.dumps({"hosts": ["www.ondorealestate.com", "ondorealestate.com"]}).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  purge_http = resp.status
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as exc:
              purge_http = exc.code
              raw = exc.read().decode()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  fail(f"Cloudflare cache purge HTTP {purge_http}: {raw[:240]}")
          except urllib.error.URLError as exc:
              fail(f"Cloudflare cache purge network error: {exc}")

          print(json.dumps({k: data.get(k) for k in ("success", "errors", "messages")}, indent=2))
          if purge_http != 200 or not data.get("success"):
              fail("Cloudflare cache purge failed. Token needs Zone Cache Purge. Payload is hostname purge for www + apex (not purge_everything).")
          print("Cloudflare cache purged by hostname for www.ondorealestate.com and ondorealestate.com.")
          PY

  # A deploy that reports success but never reaches the edge is now a red build.
  # Static export has no hashed entry chunk in the HTML the way the dashboard SPA
  # does, so this checks live URL 200s (cache-busted) rather than a build id.
  verify-production:
    needs: purge-cloudflare
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production URLs return 200
        run: |
          URLS="https://www.ondorealestate.com/ https://www.ondorealestate.com/blog/two-years-of-tax-returns-vs-one-year-mortgage/ https://www.ondorealestate.com/calculators/cost-of-living/"

          for attempt in $(seq 1 20); do
            ALL_OK=1
            for url in $URLS; do
              CB=$(date +%s%N)
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${url}?cb=${CB}" || true)
              echo "attempt ${attempt}/20: ${url} -> ${STATUS}"
              if [ "$STATUS" != "200" ]; then
                ALL_OK=0
              fi
            done
            if [ "$ALL_OK" = "1" ]; then
              echo "All production URLs returned 200."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Production never returned 200 for all smoke URLs after deploy+purge."
          exit 1
