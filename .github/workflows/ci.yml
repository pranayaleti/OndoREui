name: OndoREui CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CI uses Node 24 (GitHub Actions). .nvmrc 20.19.0 is the local floor matching engines >=20.19.0.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # Blocks on critical only. browserslist is pinned via package.json overrides
        # (>=4.28.8). Some highs stay open on purpose: Next 15's nested postcss (fix is
        # next@16) and sharp 0.35 (breaking for the image optimizer). Do not --force those
        # majors. The next step lists the highs so new ones are seen.
        run: npm audit --audit-level=critical

      - name: Dependency audit (production highs, informational)
        # Never fails the build. Read the output in the job log: a new high on the
        # production path (--omit=dev) should be triaged, not merged unnoticed.
        run: npm audit --omit=dev --audit-level=high || true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Broken link check
        # Every link, image, JSON-LD URL, redirect and Markdown link in the export must resolve,
        # so new 404s fail here instead of shipping. Old and guessed URLs live in public/_redirects.
        run: npm run check:links

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe) suite
        # tests/a11y.spec.ts and @axe-core/playwright were configured but never executed
        # by CI, so WCAG regressions shipped silently. This is a licensed housing site;
        # inaccessible real-estate web content is an active litigation area.
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api

      - name: Link-in-bio page guards
        # /links is what every social bio and printed QR code opens: no payment scripts, a
        # script budget, the booking button on the first screen, and working /go/ short links.
        run: npm run test:links
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api
