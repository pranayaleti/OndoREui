name: OndoREui CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the older run. workflow_dispatch runs on the same ref
# share the group, which is fine: the newest run is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A hung step would otherwise run for the 6-hour default. A normal run takes well under 15 minutes.
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # CI uses Node 24 and .nvmrc matches it. engines (>=20.19.0) is the supported floor.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # Blocks on critical only. browserslist is pinned via package.json overrides
        # (>=4.28.8). Some highs stay open on purpose: Next 15's nested postcss (fix is
        # next@16) and sharp 0.35 (breaking for the image optimizer). Do not --force those
        # majors. The next step lists the highs so new ones are seen.
        run: npm audit --audit-level=critical

      - name: Dependency audit (production highs, informational)
        # Never fails the build. Read the output in the job log: a new high on the
        # production path (--omit=dev) should be triaged, not merged unnoticed.
        run: npm audit --omit=dev --audit-level=high || true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        # Warnings fail the build so unused imports and dead helpers do not accumulate.
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Broken link check
        # Every link, image, JSON-LD URL, redirect and Markdown link in the export must resolve,
        # so new 404s fail here instead of shipping. Old and guessed URLs live in public/_redirects.
        run: npm run check:links

      - name: SEO metadata check
        # Reads out/**/index.html and the sitemaps: og:url must match the canonical, canonical and
        # JSON-LD urls end in a slash, indexable pages have a title, description and og:type, and
        # sitemap entries are exported HTML pages. Length and inbound-link counts only warn.
        run: npm run check:seo

      - name: Performance budget
        # Gzip JS ceilings for the shared base and for /, /buy/, a city page and a calculator, plus a
        # check that recharts, leaflet, Sentry and the glossary data stay out of the shared base.
        # Ceilings live in BUDGETS in scripts/analyze-bundle.mjs, a few percent above today's sizes.
        run: node scripts/analyze-bundle.mjs --check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile: it pins the Playwright version, and each version needs its own browser build.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # A cache hit skips the browser download; --with-deps still installs the system libraries.
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe) suite
        # tests/a11y.spec.ts and @axe-core/playwright were configured but never executed
        # by CI, so WCAG regressions shipped silently. This is a licensed housing site;
        # inaccessible real-estate web content is an active litigation area.
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api

      - name: Link-in-bio page guards
        # /links is what every social bio and printed QR code opens: no payment scripts, a
        # script budget, the booking button on the first screen, and working /go/ short links.
        run: npm run test:links
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api

      - name: Unsolicited popup guard
        # tests/verify-popups.spec.ts: no dialog, notification-permission prompt or stacked fixed
        # bottom bars on /, the calculators and /notary. It was never wired into CI.
        run: npm run test:popups
        env:
          NEXT_PUBLIC_DASHBOARD_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api
