name: OndoREui CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CI uses Node 24 (GitHub Actions). .nvmrc 20.19.0 is the local floor matching engines >=20.19.0.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # Remaining highs are Next 15's nested postcss (fix is next@16) and sharp 0.35
        # (breaking for the image optimizer). Do not --force those majors.
        run: npm audit --audit-level=critical

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe) suite
        # tests/a11y.spec.ts and @axe-core/playwright were configured but never executed
        # by CI, so WCAG regressions shipped silently. This is a licensed housing site;
        # inaccessible real-estate web content is an active litigation area.
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_APP_PORTAL_URL: https://app.ondorealestate.com
          NEXT_PUBLIC_BACKEND_BASE_URL: https://api.ondorealestate.com
